<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>OAuth callback</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:4rem auto;padding:0 1rem}
  code{display:block;background:#f2f2f2;padding:1rem;border-radius:8px;
       font-size:1.1rem;word-break:break-all;margin:1rem 0}
  button{padding:.6rem 1.2rem;font-size:1rem;border-radius:6px;cursor:pointer}
  .err{color:#b00}
</style>
<h1>Kod autoryzacyjny</h1>
<div id="out"></div>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), err = p.get('error');
  const out = document.getElementById('out');
  if (code) {
    out.innerHTML = '<code id="c">' + code + '</code><button id="b">Kopiuj</button>';
    document.getElementById('b').onclick = () =>
      navigator.clipboard.writeText(code).then(() => b.textContent = 'Skopiowano');
  } else {
    out.innerHTML = '<p class="err">Brak kodu' +
      (err ? ': ' + err + ' — ' + (p.get('error_description') || '') : '') + '</p>';
  }
</script>
